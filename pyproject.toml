[project]
# ! Поменяйте имя проекта.
name = "python-template"
dynamic = ["version"]
description = "Python Template"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
python-template = "python_template.cli:main"

[dependency-groups]
dev = [
  "lefthook>=2.1.6",
  "mypy>=1.20.0",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.2",
]
github-workflows = [
  "pytest-github-actions-annotate-failures>=0.4.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Версионирование ведется относительно git tags.
[tool.hatch.version]
source = "vcs"

# ! Измените путь файла с версией под свой пакет.
[tool.hatch.build.hooks.vcs]
version-file = "src/python_template/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# ! Все таки я рекомендую выставить необходимые правила вместо всех (иначе придется пополнять ignore или следовать возможно тупым ограничениям).
select = [
  "ALL",
]
ignore = [
  "D", # pydocstyle
  "TD", # flake8-todos
  "FIX", # flake8-fixme
  "COM812", # missing-trailing-comma
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "INP001", # implicit-namespace-package
  "S101", # assert
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
omit = [
  "tests/*",
]

# Хотите писать без типов? Уберите strict, уберите комменты, измените настройки .vscode -> settings.json -> "python.analysis.typeCheckingMode": "standard".
[tool.mypy]
strict = true
# check_untyped_defs = true
# warn_return_any = true
# disallow_any_generics = true
# ignore_missing_imports = true
# disable_error_code = ["var-annotated"]
